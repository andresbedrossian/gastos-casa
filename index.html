<html lang="es">
<head>

<style>
:root {
  --bg: #f3f1e8; --card: #ffffff; --ink: #1e2a24; --mut: #76807a; --line: #e5e3d8;
  --acc: #2e5e4e; --acc-ink: #ffffff; --soft: #e3eee8;
  --hero: #234a3d; --hero-ink: #f4f1e8; --hero-mut: #a8c2b6; --lum: #e3b04b;
  --p1: #6fc3a8; --p2: #e9c46a; --p3: #8fb3e8; --pn: #bcc2c6;
  --warn: #d5412e; --ok: #2f9e6e;
  --c1: #04896c; --c2: #cca541; --c3: #5a8dd7; --cb: var(--acc);
  --sombra: 0 1px 2px rgba(20, 24, 40, 0.04), 0 10px 28px rgba(20, 24, 40, 0.07);
  --serif: Fraunces, Georgia, "Times New Roman", serif;
  --sans: Figtree, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
:root[data-tema="ciruela"] {
  --bg: #f8f2ef; --ink: #2a1d29; --mut: #8a7a86; --line: #eee3e0;
  --acc: #5c2b54; --soft: #f4e6ee;
  --hero: #40203c; --hero-ink: #faf1ee; --hero-mut: #cbaec3; --lum: #f2a65a;
  --p1: #b79cf2; --p2: #f2a65a; --p3: #7fc8b0;
  --c1: #7e62b4; --c2: #e3984b; --c3: #00a482;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1512; --card: #18211c; --ink: #eef1ea; --mut: #93a099; --line: #27342d;
    --acc: #7fd0b6; --acc-ink: #0f1512; --soft: #203028;
    --hero: #1f3c32; --lum: #e9c46a; --p1: #7fd0b6; --warn: #ff8674; --ok: #5cc79a;
    --c1: #038f71; --c2: #b18b1f; --c3: #5487d0; --cb: var(--hero-mut);
    --sombra: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 28px rgba(0, 0, 0, 0.35);
  }
  :root[data-tema="ciruela"] {
    --bg: #151015; --card: #211923; --ink: #f5eef2; --mut: #a593a2; --line: #352a37;
    --acc: #e7b1d6; --acc-ink: #2a1d29; --soft: #322536;
    --hero: #3c2240; --p1: #c3acf5;
    --c1: #8468ba; --c2: #c67e2e; --c3: #019d7d;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: 16px/1.4 var(--sans); background: var(--bg); color: var(--ink);
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { max-width: 480px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 16px 128px; }
.vista { display: none; }
.vista.on { display: block; }
h1 { font: 600 32px/1.08 var(--serif); letter-spacing: -0.02em; margin: 22px 0 18px; }
h1.tit { font-size: 26px; margin: 6px 0 14px; }
h2 { font: 700 12px/1.2 var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--mut); margin: 0 0 10px; }
p { margin: 6px 0; }
.mut { color: var(--mut); }
.chico { font-size: 13px; }
.centro { text-align: center; }
.der { text-align: right; white-space: nowrap; }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.paso { animation: entra 0.18s ease-out; }

.tope { display: flex; align-items: center; justify-content: space-between; height: 40px; }
.volver {
  display: inline-flex; align-items: center; gap: 2px; height: 40px; padding: 0 16px 0 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card); font-weight: 600; font-size: 15px;
}
.volver svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.volver.no { visibility: hidden; }
.paso-n { font-size: 13px; font-weight: 600; color: var(--mut); }
.puntos { display: flex; gap: 6px; margin-top: 14px; }
.puntos i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.puntos i.on { background: var(--lum); }

.ops { display: grid; gap: 10px; }
.ops.dos { grid-template-columns: 1fr 1fr; }
.op {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 66px; padding: 12px 14px; margin: 0;
  border-radius: 18px; border: 1.5px solid transparent; background: var(--card); box-shadow: var(--sombra);
  font-size: 18px; font-weight: 600; text-align: left;
}
.op.sel { border-color: var(--acc); background: var(--soft); }
.op-t { flex: 1; min-width: 0; }
.op-t small { display: block; font-size: 13px; font-weight: 500; color: var(--mut); }
.ops.dos .op { min-height: 60px; padding: 10px 12px; gap: 10px; font-size: 15.5px; line-height: 1.2; }
/* "Otros" va siempre último, solo en su fila y centrado */
.ops.dos .op.solo { grid-column: 1 / -1; justify-self: center; width: calc(50% - 5px); }
.av {
  flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  font: 600 20px/1 var(--serif); color: #1b2030;
}
.ico {
  flex: 0 0 auto; width: 38px; height: 38px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center;
  background: var(--soft); color: var(--acc); font-weight: 700; font-size: 16px;
}
.ico svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.op.sel .ico { background: var(--card); }
.pt { flex: 0 0 auto; display: inline-block; width: 10px; height: 10px; border-radius: 50%; }

.btn {
  display: block; width: 100%; min-height: 56px; padding: 15px 18px; margin: 12px 0 0; border-radius: 18px;
  border: 1.5px solid var(--line); background: var(--card); font-size: 17px; font-weight: 600; text-align: center;
}
.btn.prim { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); font-weight: 700; }
.btn.prim:disabled { opacity: 0.35; cursor: default; }
.btn.prim.rojo { background: var(--warn); border-color: var(--warn); color: #ffffff; }
.btn.fant { background: transparent; border-color: transparent; color: var(--mut); }
.btn.peligro { background: transparent; border-color: transparent; color: var(--warn); }
.btn:active, .op:active, .volver:active { transform: scale(0.985); }
.pie { display: flex; gap: 10px; margin-top: 12px; }
.pie .btn { margin-top: 0; }
.pie .atras { flex: 0 0 38%; }

.monto {
  display: flex; align-items: baseline; gap: 8px; padding: 18px 20px; border-radius: 22px;
  background: var(--card); box-shadow: var(--sombra); border: 1.5px solid transparent;
}
.monto:focus-within, .texto:focus { border-color: var(--acc); }
.monto span { font: 500 34px/1.1 var(--serif); color: var(--mut); }
.monto input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0; font: 600 46px/1.1 var(--serif); letter-spacing: -0.02em; }
.texto {
  width: 100%; padding: 18px 20px; border-radius: 22px; border: 1.5px solid transparent; outline: 0;
  background: var(--card); box-shadow: var(--sombra); font-size: 20px;
}
.eco { margin: 10px 4px 0; color: var(--mut); font-size: 14px; }

.card { background: var(--card); border-radius: 22px; padding: 18px; margin-top: 12px; box-shadow: var(--sombra); }
.fila {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0;
  border: 0; border-top: 1px solid var(--line); background: transparent; width: 100%; text-align: left;
}
.card > .fila:first-child, h2 + .fila { border-top: 0; }
.fila.tocable { padding: 14px 0; }
.lapiz { color: var(--acc); font-size: 13px; font-weight: 700; margin-left: 10px; }

.hero { background: var(--hero); color: var(--hero-ink); border-radius: 26px; padding: 22px 20px 18px; margin-top: 12px; box-shadow: var(--sombra); }
.hero h2 { color: var(--hero-mut); }
.total { font: 600 50px/1 var(--serif); letter-spacing: -0.03em; margin: 4px 0 18px; }
.reparte { display: flex; gap: 3px; height: 10px; margin-bottom: 6px; }
.reparte i { display: block; height: 100%; border-radius: 5px; min-width: 6px; }
.quien { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 8px; font-size: 15px; }
.quien span { display: inline-flex; align-items: center; gap: 8px; }

.concepto { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
.cuerpo { flex: 1; min-width: 0; }
.concepto .linea { display: flex; justify-content: space-between; gap: 12px; font-weight: 500; }
.barra { height: 6px; background: var(--line); border-radius: 3px; margin-top: 7px; overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--lum); border-radius: 3px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; }
.chip { padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); white-space: nowrap; font-size: 15px; font-weight: 600; color: var(--mut); }
.chip.sel { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
.pendiente { display: block; width: 100%; text-align: left; border: 0; background: var(--lum); color: #1b2030; box-shadow: none; }

.campo { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; }
.campo > span { display: inline-flex; align-items: center; gap: 8px; }
.campo input {
  width: 52%; text-align: right; font-size: 18px; font-weight: 700; padding: 12px 14px;
  border: 1.5px solid transparent; border-radius: 14px; background: var(--bg); outline: 0;
}
.campo input:focus { border-color: var(--acc); }
.resultado { margin-top: 12px; padding: 14px 16px; border-radius: 16px; background: var(--soft); font-weight: 700; }

.gasto { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
h2 + .gasto { border-top: 0; padding-top: 4px; }
.gasto .cuerpo { line-height: 1.3; }
.meta { display: flex; align-items: center; gap: 6px; color: var(--mut); font-size: 13px; margin-top: 3px; }
.meta .pt { width: 8px; height: 8px; }
.enlace { border: 0; background: transparent; color: var(--warn); font-size: 14px; font-weight: 700; padding: 6px 0 2px 14px; }
.cab { display: flex; justify-content: space-between; gap: 12px; width: 100%; border: 0; background: transparent; padding: 0; text-align: left; }
.cab b { font-size: 17px; }
.sub { margin-top: 16px; }

.listo { text-align: center; padding: 44px 0 10px; }
.tilde {
  width: 76px; height: 76px; border-radius: 50%; background: var(--ok); color: #ffffff; margin: 0 auto;
  display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700; animation: pop 0.3s ease-out;
}
.tilde svg { width: 38px; height: 38px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.tilde.espera { background: var(--line); color: var(--mut); animation: none; }
.tilde.mal { background: var(--warn); }
.listo h1 { margin: 16px 0 0; font-size: 28px; }
.grande { font: 600 44px/1.1 var(--serif); letter-spacing: -0.02em; margin: 6px 0; }
.falla { box-shadow: var(--sombra), 0 0 0 1.5px var(--warn); margin: 0 0 12px; }
.guardando { text-align: center; margin: 0 0 8px; }
.espera { text-align: center; }
p.espera { padding: 48px 0; }

.temas { display: flex; gap: 8px; }
.tema {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 6px 10px;
  border: 1.5px solid var(--line); border-radius: 16px; background: transparent; font-size: 13px; font-weight: 600; color: var(--mut);
}
.tema.sel { border-color: var(--acc); color: var(--ink); }
.tema span { display: flex; padding-left: 6px; }
.tema i { width: 22px; height: 22px; border-radius: 50%; margin-left: -6px; border: 2px solid var(--card); }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 0 16px calc(12px + env(safe-area-inset-bottom)); pointer-events: none; }
.nav div {
  pointer-events: auto; max-width: 448px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 6px;
  background: var(--card); border-radius: 24px; box-shadow: var(--sombra), 0 0 0 1px var(--line);
}
.nav button { border: 0; background: transparent; border-radius: 18px; padding: 8px 4px 7px; font-size: 12px; font-weight: 600; color: var(--mut); }
.nav button.on { background: var(--soft); color: var(--acc); }
.nav.cinco div { gap: 2px; }
.nav.cinco button { font-size: 11px; padding-left: 0; padding-right: 0; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav svg { display: block; width: 23px; height: 23px; margin: 0 auto 2px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

.velo { position: fixed; inset: 0; background: rgba(10, 12, 20, 0.3); display: flex; align-items: center; justify-content: center; z-index: 20; }
.rueda { width: 44px; height: 44px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, 0.5); border-top-color: var(--lum); animation: gira 0.8s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.aviso {
  position: fixed; left: 16px; right: 16px; bottom: calc(96px + env(safe-area-inset-bottom)); max-width: 448px; margin: 0 auto; z-index: 30;
  background: var(--ink); color: var(--bg); padding: 13px 16px; border-radius: 16px; font-size: 15px; font-weight: 500; animation: entra 0.18s ease-out;
}
.modal { position: fixed; inset: 0; background: rgba(10, 12, 20, 0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 25; }
.modal .caja { background: var(--card); width: 100%; max-width: 480px; border-radius: 26px 26px 0 0; padding: 22px 16px calc(20px + env(safe-area-inset-bottom)); animation: entra 0.18s ease-out; }
.modal h3 { margin: 0 0 6px; font: 600 24px/1.15 var(--serif); letter-spacing: -0.01em; }
.paso.medio { display: flex; flex-direction: column; justify-content: center; min-height: calc(100vh - 205px); min-height: calc(100dvh - 205px); padding-bottom: 5vh; }
.paso.medio.tecla { justify-content: flex-start; padding-top: 7vh; padding-bottom: 0; }
.paso.medio h1 { text-align: center; margin-top: 0; }
.paso.medio .eco { text-align: center; }
.dia { border: 0; outline: 0; background: transparent; padding: 0; margin: 0; min-height: 22px; font-weight: 700; text-align: right; -webkit-appearance: none; appearance: none; }
.total { font-variant-numeric: normal; }
.seg { display: flex; gap: 2px; height: 8px; margin: 4px 0 6px; }
.seg i { display: block; height: 100%; min-width: 4px; border-radius: 4px; }
.barra.b i { background: var(--cb); border-radius: 0 3px 3px 0; }
.sublinea { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; font-size: 13px; color: var(--mut); }
.graf { display: block; width: 100%; height: auto; margin: 6px 0 4px; overflow: visible; }
.graf text { font: 500 10px var(--sans); fill: var(--mut); }
.graf text.v { font-weight: 700; fill: var(--ink); }
.graf .m { fill: var(--cb); }
.graf line { stroke: var(--line); stroke-width: 1; }
.graf .col { outline: 0; }
.graf .col:hover .m, .graf .col:focus .m { opacity: 0.7; }
.pie .texto { flex: 1; min-width: 0; padding: 14px 16px; font-size: 17px; }
.paso.medio.tecla.alto { padding-top: 14px; }
.alto h1 { margin-bottom: 14px; }
.alto .monto { padding: 15px 20px; }
.alto .eco { margin-top: 8px; }
.cuo { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.cuo-t { flex: none; font-size: 13px; font-weight: 600; color: var(--mut); }
.cuo .chips {
  flex: 1; min-width: 0; position: relative; padding: 0; scrollbar-width: none;
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 26px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 26px), transparent);
}
.cuo .chips::-webkit-scrollbar { display: none; }
.cuo .chips::after { content: ''; flex: 0 0 18px; }
.cuo .chip { flex: none; padding: 8px 14px; }
select.chip { -webkit-appearance: none; appearance: none; font: inherit; font-size: 15px; font-weight: 600; text-align: center; text-align-last: center; cursor: pointer; }
.total small { font: 600 22px/1 var(--sans); letter-spacing: 0; color: var(--hero-mut); margin-right: 4px; }
.campo select, .campo input[type=date] {
  width: 52%; min-height: 50px; font: inherit; font-size: 16px; font-weight: 700; color: inherit; padding: 12px 14px; text-align: right; text-align-last: right;
  border: 1.5px solid transparent; border-radius: 14px; background: var(--bg); outline: 0; -webkit-appearance: none; appearance: none;
}
.campo select:focus, .campo input[type=date]:focus { border-color: var(--acc); }
.campo .chips { padding: 0; justify-content: flex-end; }
.tip { position: fixed; z-index: 40; pointer-events: none; background: var(--ink); color: var(--bg); padding: 7px 10px; border-radius: 10px; font-size: 13px; font-weight: 600; white-space: nowrap; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .paso, .tilde, .aviso, .modal .caja { animation: none; } }
</style>
</head>

<script>try { document.documentElement.setAttribute('data-tema', localStorage.getItem('gc_tema') === 'ciruela' ? 'ciruela' : 'bosque'); } catch (e) { document.documentElement.setAttribute('data-tema', 'bosque'); }</script>
<div class="app">
  <div id="cola"></div>
  <main id="v-cargar" class="vista"></main>
  <main id="v-editar" class="vista"></main>
  <main id="v-resumen" class="vista"></main>
  <main id="v-stats" class="vista"></main>
  <main id="v-prestamos" class="vista"></main>
  <main id="v-historico" class="vista"></main>
</div>

<nav class="nav" id="nav"><div>
  <button data-a="vista" data-v="cargar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Cargar</button>
  <button data-a="vista" data-v="resumen"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Resumen</button>
  <button data-a="vista" data-v="stats"><svg viewBox="0 0 24 24"><path d="M4 19.5h16"/><path d="M5.5 15l4.5-5 3.5 3 5-6.5"/></svg>Estadísticas</button>
  <button data-a="vista" data-v="prestamos" id="nav-pre" hidden><svg viewBox="0 0 24 24"><path d="M4 8.5h14M15 5.5l3 3-3 3"/><path d="M20 15.5H6M9 12.5l-3 3 3 3"/></svg>Préstamos</button>
  <button data-a="vista" data-v="historico"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Histórico</button>
</div></nav>

<div id="velo" class="velo" hidden><div class="rueda"></div></div>
<div id="aviso" class="aviso" hidden></div>
<div id="tip" class="tip" hidden></div>
<div id="modal" class="modal" hidden>
  <div class="caja">
    <h3 id="m-tit"></h3>
    <p id="m-txt" class="mut"></p>
    <button class="btn prim" data-a="modal-ok" id="m-ok"></button>
    <button class="btn fant" data-a="modal-no">Cancelar</button>
  </div>
</div>

<script>
// Puente con la planilla: reemplaza a google.script.run (que solo existe dentro de Google) por pedidos a la API,
// con la clave de este celular. Así el resto de la app es igual al hub.
var API_URL = "https://script.google.com/macros/s/AKfycbwFQh2FYO09dr2Q9czZGbdG7g3vJfK6_7Ls3Afal8QUuYoZRfqIPQ6xFwbCjaPA7SjJbA/exec";
var CLAVE_KEY = 'gc_clave';
function claveGuardada() { try { return localStorage.getItem(CLAVE_KEY) || ''; } catch (e) { return ''; } }
(function () {
  // Una sola vez: el link puede traer la clave (#clave=...). Se guarda y se borra del link
  var m = /[#&]clave=([A-Za-z0-9]{16,64})/.exec(location.hash);
  if (m) {
    try { localStorage.setItem(CLAVE_KEY, m[1]); } catch (e) {}
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
})();
function pedirClave(motivo) {
  if (document.getElementById('pide-clave')) return;
  var d = document.createElement('div');

    c.innerHTML = '<div class="listo"><div class="tilde ' + est[0] + '">' + est[1] + '</div><h1>' + est[2] + '</h1>' +
      '<p class="grande">' + pesos(enviado.importe) + '</p>' +
      '<p class="mut">' + esc(enviado.pago) + ' · ' + esc(enviado.concepto) +
      (enviado.detalle ? ' · ' + esc(enviado.detalle) : '') + (mesDe(enviado) ? ' · ' + esc(mesDe(enviado)) : '') + (enviado.cuotas > 1 ? ' · en ' + enviado.cuotas + ' cuotas' : '') + '</p></div>' +
      '<button class="btn prim" data-a="otro">Cargar otro gasto</button>' +
      '<button class="btn fant" data-a="vista" data-v="resumen">Ver resumen</button>';
    return;
  }
  pintarAsistente(c, wn);
}

// El mismo asistente sirve para cargar un gasto nuevo y para editar uno que ya está
function pintarAsistente(c, w) {
  var g = w.g, paso = w.paso, ed = !!w.id, t = '';
  var orden = pasos.indexOf(paso === 'mes' || paso === 'cuotas' ? 'resumen' : paso);
  var conAtras = ed || paso !== 'pago' || w.volver;
  // Atrás va siempre arriba a la izquierda, en el mismo lugar en todos los pasos
  t += '<div class="tope"><button class="volver' + (conAtras ? '' : ' no') + '" data-a="atras">' + CHEVRON + 'Atrás</button>' +
    '<span class="paso-n">' + (ed ? 'Editando' : 'Paso ' + (orden + 1) + ' de ' + pasos.length) + '</span></div>';
  if (!ed) {
    t += '<div class="puntos">';
    for (var k = 0; k < pasos.length; k++) t += '<i class="' + (k <= orden ? 'on' : '') + '"></i>';
    t += '</div>';
  }
  // Las preguntas van centradas en la pantalla; donde se escribe, quedan más arriba para que el teclado no las tape
  t += '<div class="paso medio' + (paso === 'importe' || paso === 'detalle' ? ' tecla' : '') + (paso === 'importe' && !ed ? ' alto' : '') + '">';

  if (paso === 'pago') {
    t += '<h1>¿Quién pagó?</h1><div class="ops">';
    E.integrantes.forEach(function (n) { t += opcion('pago', n, g.pago === n, avatar(n)); });
    // "Préstamo" se ofrece solo mientras haya plata prestada sin devolver (o si el gasto que se edita ya estaba así)
    if ((ed && w.orig.pago === PAGO_PRESTAMO) || (E.prestamos && E.prestamos.deuda > 0.005)) t += opcion('pago', PAGO_PRESTAMO, g.pago === PAGO_PRESTAMO, avatar(PAGO_PRESTAMO), 'No entra en el reparto del mes');
    t += '</div>';
  } else if (paso === 'importe') {
    t += '<h1>¿Cuánto?</h1><div class="monto"><span>$</span>' +
      '<input id="in-importe" data-num inputmode="decimal" autocomplete="off" value="' + miles(g.importe) + '"></div>' +
      '<div class="eco" id="eco-importe">Centavos con punto o coma</div>';
    // Las cuotas se eligen acá mismo (por defecto, contado). Al editar no: cada cuota ya es un gasto aparte
    if (!ed) {
      t += '<div class="cuo"><span class="cuo-t">Cuotas</span><div class="chips" id="cuo">';
      CUOTAS.forEach(function (n) {
        t += '<button type="button" class="chip" data-a="cuo" data-v="' + n + '" aria-label="' + (n === 1 ? 'Contado' : n + ' cuotas') + '">' + (n === 1 ? 'Contado' : n) + '</button>';
      });
      t += '<select class="chip" id="sel-cuotas" aria-label="Otra cantidad de cuotas"><option value="">Otra</option>';
      for (var q = 2; q <= 48; q++) if (CUOTAS.indexOf(q) < 0) t += '<option value="' + q + '">' + q + ' cuotas</option>';
      t += '</select></div></div>';
    }
    t += '<button class="btn prim" data-a="sig" id="b-sig">' + (w.volver ? 'Listo' : 'Siguiente') + '</button>';
  } else if (paso === 'concepto') {
    t += '<h1>¿En qué?</h1><div class="ops dos">';
    conceptosOrdenados().forEach(function (n) { t += opcion('concepto', n, g.concepto === n, icono(n), '', esOtros(n) ? 'solo' : ''); });
    t += '</div>';
  } else if (paso === 'detalle') {
    t += '<h1>¿Algún detalle?</h1><input id="in-detalle" class="texto" maxlength="200" autocomplete="off" placeholder="Opcional" value="' + esc(g.detalle) + '">' +
      '<button class="btn prim" data-a="sig" id="b-sig">' + textoSig(w) + '</button>';
  } else if (paso === 'cuotas') {
    t += '<h1>¿En cuántas cuotas?</h1><div class="ops dos">';
    CUOTAS.forEach(function (n) {
      t += '<button class="op' + (g.cuotas === n ? ' sel' : '') + '" data-a="cuotas" data-v="' + n + '"><span class="op-t">' + (n === 1 ? 'Contado' : n + ' cuotas') +
        (n > 1 && Number(g.importe) >= n ? '<small>de ' + pesos(cuotaDe(g.importe, n)) + '</small>' : '') + '</span></button>';
    });
    t += '</div><div class="pie"><input id="in-cuotas" class="texto" data-nofoco="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Otra cantidad">' +
      '<button class="btn prim atras" data-a="cuotas-otra">Listo</button></div>';
  } else if (paso === 'mes') {
    t += '<h1>¿De qué mes?</h1><div class="ops">';
    E.abiertos.concat([E.siguiente]).forEach(function (n) {
      t += opcion('mes', n, (g.mes || E.actual) === n, '', n === E.actual ? 'Mes en curso' : '');
    });
    t += '</div>';
  } else {
    t += '<h1>' + (ed ? 'Editar gasto' : '¿Está bien?') + '</h1><div class="card">' +
      linea('pago', 'Pagó', g.pago) +
      linea('importe', 'Importe', pesos(g.importe)) +
      linea('concepto', 'Concepto', g.concepto) +
      linea('detalle', 'Detalle', g.detalle || 'Sin detalle') +
      '<label class="fila tocable"><span class="mut">Día</span><span class="der"><input type="date" id="in-fecha" class="dia" value="' + esc(g.fecha || hoy()) + '">' +
      '<span class="lapiz">Cambiar</span></span></label>' +
      (ed ? '' : linea('cuotas', 'Cuotas', g.cuotas > 1 ? g.cuotas + ' de ' + pesos(cuotaDe(g.importe, g.cuotas)) : 'Contado')) +
      linea('mes', g.cuotas > 1 ? 'Primera cuota' : 'Mes', g.mes || E.actual) + '</div>';
    if (!ed && g.cuotas > 1) t += '<p class="mut chico centro">Se reparte en ' + g.cuotas + ' meses, de ' + esc(g.mes || E.actual) + ' a ' +
      esc(etiquetaDeClave(sumaMes(claveDe(g.mes || E.actual), g.cuotas - 1))) + '.</p>';
    if (ed) {
      var enCuotas = (E.gastos.filter(function (y) { return y.id === w.id; })[0] || {}).cuota;
      if (enCuotas) t += '<p class="mut chico centro">Es la cuota ' + esc(enCuotas) + ' de una compra en cuotas: los cambios valen solo para esta cuota.</p>';
      t += '<button class="btn prim" data-a="guardar-ed"' + (hayCambios(w) ? '' : ' disabled') + '>Guardar cambios</button>' +
        '<button class="btn peligro" data-a="anular" data-v="' + esc(w.id) + '">' + (enCuotas ? 'Anular esta cuota' : 'Anular gasto') + '</button>';
      if (enCuotas) t += '<button class="btn peligro" data-a="anular-todas" data-v="' + esc(w.id) + '">Anular esta y las que siguen</button>';
    } else {
      t += '<button class="btn prim" data-a="enviar">Cargar gasto</button>';
    }
  }
  c.innerHTML = t + '</div>';
  ecoCuotas(true);
  var inp = c.querySelector('input:not([type=date]):not([data-nofoco])');
  if (inp) {
    inp.focus();
    try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {}
  }
}
function textoSig(w) { return w.volver ? 'Listo' : (w.g.detalle ? 'Siguiente' : 'Saltar'); }
// En "¿Cuánto?": marca la cantidad de cuotas elegida y dice de cuánto queda cada una.
// Actualiza lo que ya está en pantalla, sin volver a dibujarla, para no sacarle el teclado al que está escribiendo.
function ecoCuotas(centrar) {
  var caja = $('cuo'), eco = $('eco-importe'), otra = $('sel-cuotas');
  if (!caja || !eco || !otra) return;
  var g = W().g, n = g.cuotas || 1, imp = Number(g.importe), sel = null;
  var cs = caja.querySelectorAll('[data-a="cuo"]');
  for (var i = 0; i < cs.length; i++) {
    var on = Number(cs[i].getAttribute('data-v')) === n;
    cs[i].className = 'chip' + (on ? ' sel' : '');
    cs[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    if (on) sel = cs[i];
  }
  otra.value = sel ? '' : String(n);
  otra.className = 'chip' + (sel ? '' : ' sel');
  eco.textContent = n > 1 ? n + ' cuotas' + (imp >= n ? ' de ' + pesos(cuotaDe(imp, n)) : '') : 'Centavos con punto o coma';
  if (centrar) { var el = sel || otra; caja.scrollLeft = Math.max(0, el.offsetLeft - (caja.clientWidth - el.offsetWidth) / 2); }
}

function mesesResumen() {
  var ms = E.abiertos.slice();
  if (E.gastos.some(function (x) { return x.mes === E.siguiente && !x.anulado; })) ms.push(E.siguiente);
  return ms;
}

function pintarResumen() {
  var ms = mesesResumen(), t = '';
  if (ms.indexOf(mesSel) < 0) mesSel = ms.indexOf(E.actual) >= 0 ? E.actual : ms[ms.length - 1];
  var c = calc(mesSel, ingresosDe(mesSel));
  var pendiente = E.abiertos[0] !== E.actual ? E.abiertos[0] : null;
  var cerrable = mesSel === pendiente;

  if (ms.length > 1) {
    t += '<div class="chips">';
    ms.forEach(function (m) { t += '<button class="chip' + (m === mesSel ? ' sel' : '') + '" data-a="mesres" data-v="' + esc(m) + '">' + esc(m) + '</button>'; });
    t += '</div>';
  }
  if (pendiente && !cerrable) {
    t += '<button class="card pendiente" data-a="mesres" data-v="' + esc(pendiente) + '">' + esc(pendiente) + ' ya terminó y falta cerrarlo. <b>Ver</b></button>';
  }

  t += '<section class="hero"><h2>Total de ' + esc(mesSel) + '</h2><div class="total">' + pesos(c.total) + '</div>';
  if (c.total > 0) {
    t += '<div class="reparte">';
    E.integrantes.forEach(function (n, i) {
      if (c.pago[i] > 0) t += '<i style="flex:' + c.pago[i] + ';background:' + color(n) + '"></i>';
    });
    if (c.prestado > 0) t += '<i style="flex:' + c.prestado + ';background:' + color(PAGO_PRESTAMO) + '"></i>';
    t += '</div>';
  }
  E.integrantes.forEach(function (n, i) {
    t += '<div class="quien"><span>' + punto(n) + 'Pagó ' + esc(n) + '</span><b>' + pesos(c.pago[i]) + '</b></div>';
  });
  if (c.prestado > 0) t += '<div class="quien"><span>' + punto(PAGO_PRESTAMO) + 'Con préstamo</span><b>' + pesos(c.prestado) + '</b></div>';
  t += '</section>';

  var ks = Object.keys(c.con).sort(function (a, b) { return c.con[b] - c.con[a]; });
  if (ks.length) {
    t += '<div class="card"><h2>Por concepto</h2>';
    ks.forEach(function (k) {
      t += '<div class="concepto">' + icono(k) + '<div class="cuerpo"><div class="linea"><span>' + esc(k) + '</span><b>' + pesos(c.con[k]) + '</b></div>' +
        '<div class="barra"><i style="width:' + Math.max(2, Math.round(100 * c.con[k] / c.total)) + '%"></i></div></div></div>';
    });
    t += '</div>';
  }

  var o = ing[mesSel] || {};
  t += '<div class="card"><h2>Reparto</h2><p class="mut chico">' +
    (cerrable ? 'Cargá lo que cobró cada uno para cerrar el mes.' : 'Con lo que cobró cada uno se calcula cuánto le toca. Es una estimación hasta que se cierre el mes.') + '</p>';
  E.integrantes.forEach(function (n) {
    t += '<label class="campo"><span>' + punto(n) + 'Cobró ' + esc(n) + '</span><input data-num inputmode="decimal" autocomplete="off" placeholder="$" data-ing="' + esc(n) + '" value="' + miles(o[n]) + '"></label>';
  });
  if (c.prestado > 0) t += '<p class="mut chico">Lo pagado con préstamo (' + pesos(c.prestado) + ') no entra en este reparto: se reparte a medida que se devuelve.</p>';
  t += '<div id="reparto"></div></div>';

  t += '<div class="card"><h2>Gastos</h2>';
  if (!c.gastos.length) t += '<p class="mut">Todavía no hay gastos en ' + esc(mesSel) + '.</p>';
  t += listaGastos(c.gastos, true);
  if (c.gastos.length) t += '<button class="btn" data-a="exportar">Exportar a Excel</button>';
  t += '</div>';

  // Cuotas ya cargadas que caen en los meses que siguen
  var act = claveDe(E.actual), fut = {}, totalFut = 0;
  E.gastos.forEach(function (x) {
    var k = claveDe(x.mes);
    if (!x.anulado && x.cuota && k > act) { fut[k] = (fut[k] || 0) + x.importe; totalFut += x.importe; }
  });
  if (totalFut) {
    t += '<div class="card"><h2>Cuotas que vienen</h2>';
    Object.keys(fut).sort().forEach(function (k) { t += '<div class="fila"><span>' + etiquetaDeClave(Number(k)) + '</span><b>' + pesos(fut[k]) + '</b></div>'; });
    t += '<div class="fila"><span class="mut">Total</span><b>' + pesos(totalFut) + '</b></div></div>';
  }

  $('v-resumen').innerHTML = t;
  pintarReparto();
}

function listaGastos(gs, conEditar) {
  var t = '';
  gs.slice().sort(function (a, b) { return a.fecha === b.fecha ? b.ts - a.ts : (a.fecha < b.fecha ? 1 : -1); }).forEach(function (x) {
    t += '<div class="gasto">' + icono(x.concepto) + '<div class="cuerpo"><b>' + esc(x.concepto) + '</b>' +
      (x.detalle ? ' <span class="mut">' + esc(x.detalle) + '</span>' : '') +
      '<div class="meta">' + punto(x.pago) + esc(x.pago) + ' · ' + dia(x.fecha) + (x.cuota ? ' · cuota ' + esc(x.cuota) : '') + (x.editado ? ' · editado' : '') + '</div></div>' +
      '<div class="der"><b>' + pesos(x.importe) + '</b>' +
      (!conEditar ? '' : x.concepto === CONCEPTO_PRESTAMO ? '<br><button class="enlace" data-a="vista" data-v="prestamos">Ver</button>'
        : '<br><button class="enlace" data-a="editar" data-v="' + esc(x.id) + '">Editar</button>') + '</div></div>';
  });
  return t;
}

function pintarReparto() {
  var el = $('reparto');
  if (!el) return;
  var c = calc(mesSel, ingresosDe(mesSel)), t = '';
  var pendiente = E.abiertos[0] !== E.actual ? E.abiertos[0] : null;
  if (c.hayIng) {
    E.integrantes.forEach(function (n, i) {
      t += '<div class="fila"><span>Le toca a ' + esc(n) + ' <span class="mut">' + (c.pct[i] * 100).toFixed(2) + '%</span></span><b>' + pesos(c.corr[i]) + '</b></div>';
    });
    t += '<div class="resultado">' + esc(resultado(c.saldo)) + '</div>';
  }
  if (mesSel === pendiente) {
    t += '<button class="btn prim" data-a="cerrar"' + (c.hayIng && ingresosCompletos(mesSel) ? '' : ' disabled') + '>Cerrar ' + esc(mesSel) + '</button>';
  } else if (mesSel !== E.actual && mesSel !== E.siguiente) {
    t += '<p class="mut chico">Primero hay que cerrar ' + esc(pendiente) + '.</p>';
  } else {
    t += '<p class="mut chico">' + esc(mesSel) + ' se cierra cuando termine el mes.</p>';
  }
  el.innerHTML = t;
}

function pintarHistorico() {
  var t = '<h1 class="tit">Meses cerrados</h1>';
  if (!E.historico.length) {
    t += '<div class="card"><p class="mut">Todavía no hay meses cerrados. El primero va a ser ' + esc(E.abiertos[0]) + '.</p></div>';
  }
  E.historico.slice().reverse().forEach(function (h) {
    var mes = h['Mes'];
    t += '<div class="card"><button class="cab" data-a="hist" data-v="' + esc(mes) + '"><span><b>' + esc(mes) + '</b><br>' +
      '<span class="mut chico">' + esc(h['Resultado'] || '') + '</span></span><span class="der"><b>' + pesos(h['Total gastos']) + '</b><br>' +
      '<span class="lapiz">' + (abiertoHist === mes ? 'Ocultar' : 'Ver') + '</span></span></button>';
    if (abiertoHist === mes) {
      var fijos = { 'Mes': 1, 'Cerrado el': 1, 'Total gastos': 1, 'Resultado': 1 }, nombres = [];
      Object.keys(h).forEach(function (k) {
        if (k.indexOf('Ingreso ') === 0) nombres.push(k.slice(8));
        if (/^(Ingreso |% |Pagó |Le corresponde )/.test(k)) fijos[k] = 1;
      });
      // Mismo orden que en el resto de la app (las claves del registro no llegan ordenadas)
      nombres.sort(function (a, b) {
        var ia = E.integrantes.indexOf(a), ib = E.integrantes.indexOf(b);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      });
      nombres.forEach(function (n) {
        t += '<div class="sub"><h2>' + punto(n) + ' ' + esc(n) + '</h2>' +
          '<div class="fila"><span>Cobró</span><b>' + pesos(h['Ingreso ' + n]) + ' <span class="mut">' + ((Number(h['% ' + n]) || 0) * 100).toFixed(2) + '%</span></b></div>' +
          '<div class="fila"><span>Pagó</span><b>' + pesos(h['Pagó ' + n]) + '</b></div>' +
          '<div class="fila"><span>Le tocaba</span><b>' + pesos(h['Le corresponde ' + n]) + '</b></div></div>';
      });
      if (Number(h['Pagó ' + PAGO_PRESTAMO]) > 0) {
        t += '<div class="sub"><div class="fila"><span>Con préstamo <span class="mut">(no se repartió)</span></span><b>' + pesos(h['Pagó ' + PAGO_PRESTAMO]) + '</b></div></div>';
      }
      var ks = Object.keys(h).filter(function (k) { return !fijos[k] && Number(h[k]) > 0; });
      if (ks.length) {
        t += '<div class="sub"><h2>Por concepto</h2>';
        ks.sort(function (a, b) { return h[b] - h[a]; }).forEach(function (k) {
          t += '<div class="fila"><span>' + esc(k) + '</span><b>' + pesos(h[k]) + '</b></div>';
        });
        t += '</div>';
      }
      var gs = E.gastos.filter(function (x) { return x.mes === mes && !x.anulado; });
      if (gs.length) t += '<div class="sub"><h2>Gastos</h2>' + listaGastos(gs, false) + '</div>';
      if (h['Cerrado el']) t += '<p class="mut chico">Cerrado el ' + fecha(h['Cerrado el']) + '</p>';
    }
    t += '</div>';
  });
  var tema = document.documentElement.getAttribute('data-tema') || 'bosque';
  t += '<div class="card"><h2>Colores de la app</h2><div class="temas">';
  TEMAS.forEach(function (x) {
    t += '<button class="tema' + (x[0] === tema ? ' sel' : '') + '" data-a="tema" data-v="' + x[0] + '"><span>' +
      '<i style="background:' + x[2] + '"></i><i style="background:' + x[3] + '"></i><i style="background:' + x[4] + '"></i></span>' + x[1] + '</button>';
  });
  t += '</div></div>';
  $('v-historico').innerHTML = t;
}

// ---------- Préstamos ----------

// Mes en el que entra el pago: el elegido o, si no se eligió, el del día del pago (si está abierto)
function mesPago() {
  if (wp.mes) return wp.mes;
  var m = etiquetaDe(wp.fecha || hoy());
  return E.abiertos.concat([E.siguiente]).indexOf(m) >= 0 ? m : E.actual;
}
// Actualiza lo que ya está en pantalla sin volver a dibujarla, para no sacarle el teclado al que está escribiendo
function ecoPago() {
  var eco = $('pre-eco');
  if (!eco) return;
  var u = Number(wp.dolares) || 0, tc = Number(wp.tc) || 0, cs = document.querySelectorAll('[data-a="pre-quien"]');
  for (var i = 0; i < cs.length; i++) {
    var on = cs[i].getAttribute('data-v') === wp.pago;
    cs[i].className = 'chip' + (on ? ' sel' : '');
    cs[i].setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  $('pre-mes').value = mesPago();
  eco.textContent = u > 0 && tc > 0 ? usd(u) + ' a ' + cambio(tc) + ' son ' + pesos(u * tc) + '. Entra en el reparto de ' + mesPago() + '.'
    : 'El pago entra, por su valor en pesos, en el reparto del mes elegido.';
}

// Préstamo nuevo: marca la moneda, muestra el tipo de cambio solo si es en pesos y dice cómo queda en dólares (sin volver a dibujar la pantalla)
function ecoNuevo() {
  var eco = $('pn-eco');
  if (!eco) return;
  var enPesos = wl.moneda === 'Pesos', cs = document.querySelectorAll('[data-a="pn-mon"]'), tcEl = $('pn-tc');
  for (var i = 0; i < cs.length; i++) {
    var on = cs[i].getAttribute('data-v') === wl.moneda;
    cs[i].className = 'chip' + (on ? ' sel' : '');
    cs[i].setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  $('pn-tc-campo').hidden = !enPesos;
  $('pn-monto').placeholder = enPesos ? '$' : 'usd';
  if (document.activeElement !== tcEl) tcEl.value = miles(wl.tc);
  var m = Number(wl.monto) || 0, tc = Number(wl.tc) || 0, f = wl.fecha || hoy(), t;
  if (wl.fila) t = m > 0 && Math.abs(m - wl.antes) > 0.005 ? 'Pasa de ' + usd(wl.antes) + ' a ' + usd(m) + '.' : '';
  else if (!enPesos) t = m > 0 ? 'Se suman ' + usd(m) + ' a lo que falta devolver.' : 'Se suma, en dólares, a lo que falta devolver.';
  else {
    t = wl.tcMano ? '' : wl.estado === 'buscando' ? 'Buscando el dólar BNA del ' + dia(f) + '…'

    '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"' + centro +
    '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"' + centro +
    '<xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"' + centro +
    '<xf numFmtId="10" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"' + centro + '</cellXfs>' +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  var nombres = ['Gastos', 'Por concepto', 'Quién pagó'], tipos = '', hojas = '', rels = '';
  nombres.forEach(function (n, i) {
    tipos += '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
    hojas += '<sheet name="' + esc(n) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>';
    rels += '<Relationship Id="rId' + (i + 1) + '" Type="' + NS + 'officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>';
  });
  var blob = zip([
    ['[Content_Types].xml', XML + '<Types xmlns="' + NS + 'package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' + tipos + '</Types>'],
    ['_rels/.rels', XML + '<Relationships xmlns="' + NS + 'package/2006/relationships"><Relationship Id="rId1" Type="' + NS + 'officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml', XML + '<workbook xmlns="' + NS + 'spreadsheetml/2006/main" xmlns:r="' + NS + 'officeDocument/2006/relationships"><sheets>' + hojas + '</sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels', XML + '<Relationships xmlns="' + NS + 'package/2006/relationships">' + rels +
      '<Relationship Id="rId9" Type="' + NS + 'officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
    ['xl/styles.xml', estilos],
    ['xl/worksheets/sheet1.xml', hojaXml(['Fecha', 'Pagó', 'Concepto', 'Detalle', 'Importe'], gs, [2, 0, 0, 0, 3], [13, 14, 26, 36, 14])],
    ['xl/worksheets/sheet2.xml', hojaXml(['Concepto', 'Importe', '% del total'], con, [0, 3, 4], [26, 14, 14])],
    ['xl/worksheets/sheet3.xml', hojaXml(['Integrante', 'Pagó', '% del total'], per, [0, 3, 4], [18, 14, 14])]
  ]);
  var a = document.createElement('a'), u = URL.createObjectURL(blob);
  a.href = u; a.download = 'Gastos ' + mesSel + '.xlsx'; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(u); }, 60000);
  aviso('Excel de ' + mesSel + ' listo.');
}

// ---------- Acciones ----------

function siguiente() {
  var w = W();
  if (w.paso === 'importe' && !(Number(w.g.importe) > 0)) { aviso('Poné el importe.'); return; }
  if (w.volver || w.paso === 'mes' || w.paso === 'cuotas') { w.paso = 'resumen'; w.volver = false; }
  else w.paso = pasos[pasos.indexOf(w.paso) + 1];
  pintar();
}
function atras() {
  var w = W();
  if (w.volver || w.paso === 'mes' || w.paso === 'cuotas') { w.paso = 'resumen'; w.volver = false; }
  else if (w.id) { we = null; vista = 'resumen'; }
  else { var i = pasos.indexOf(w.paso); if (i > 0) w.paso = pasos[i - 1]; }
  pintar();
}
function enviar() {
  // Sin mes elegido, el servidor lo imputa al mes en curso
  var g = wn.g;
  var x = { pago: g.pago, importe: Number(g.importe), concepto: g.concepto, detalle: g.detalle.trim(), mes: g.mes, fecha: g.fecha || hoy(), cuotas: g.cuotas };
  enviado = x; wn = asistente();
  guardar(x);
  pintar();
}
function editar(id) {
  var x = E.gastos.filter(function (y) { return y.id === id; })[0];
  if (!x) return;
  var o = { pago: x.pago, importe: x.importe, concepto: x.concepto, detalle: x.detalle, mes: x.mes, fecha: x.fecha };
  we = { g: { pago: o.pago, importe: String(o.importe), concepto: o.concepto, detalle: o.detalle, mes: o.mes, fecha: o.fecha }, paso: 'resumen', volver: false, id: x.id, orig: o };
  vista = 'editar';
  pintar();
  window.scrollTo(0, 0);
}
function guardarEdicion() {
  var g = we.g;
  llamar('apiEditar', { id: we.id, pago: g.pago, importe: Number(g.importe), concepto: g.concepto, detalle: g.detalle.trim(), mes: g.mes, fecha: g.fecha }, function () {
    mesSel = g.mes; we = null; vista = 'resumen';
    aviso('Gasto actualizado.'); pintar();
  });
}

function accion(a, v) {
  if (a === 'vista') {
    vista = v; we = null;
    if (v === 'cargar' && enviado) { enviado = null; }
    pintar();
    if (v !== 'cargar') {
      llamar('apiEstado', undefined, function () { if (vista === v && !escribiendo()) pintar(); }, true,
        function (m) { if (!E || E.parcial) { falla = m; pintar(); } });
    }
  }
  else if (a === 'reintentar') { if (cola[Number(v)]) { guardar(cola[Number(v)]); pintar(); } }
  else if (a === 'descartar') {
    var q = cola.splice(Number(v), 1)[0];
    if (q && q === enviado) enviado = null;
    pintar();
  }
  else if (a === 'pago') { W().g.pago = v; siguiente(); }
  else if (a === 'concepto') { W().g.concepto = v; siguiente(); }
  else if (a === 'mes') { W().g.mes = v; siguiente(); }
  else if (a === 'cuotas') { W().g.cuotas = Number(v) || 1; siguiente(); }
  else if (a === 'cuo') { W().g.cuotas = Number(v) || 1; ecoCuotas(); }
  else if (a === 'cuotas-otra') {
    var nc = Number($('in-cuotas').value.replace(/\D/g, ''));
    if (!(nc >= 1 && nc <= 48)) { aviso('Poné una cantidad entre 1 y 48.'); return; }
    W().g.cuotas = nc; siguiente();
  }
  else if (a === 'sig') siguiente();
  else if (a === 'atras') atras();
  else if (a === 'ir') { W().paso = v; W().volver = true; pintar(); }
  else if (a === 'enviar') enviar();
  else if (a === 'editar') editar(v);
  else if (a === 'guardar-ed') guardarEdicion();
  else if (a === 'otro') { enviado = null; pintar(); }
  else if (a === 'refrescar') {
    falla = ''; pintar();
    llamar('apiEstado', undefined, pintar, false, function (m) { falla = m; pintar(); });
  }
  else if (a === 'mesres') { mesSel = v; pintar(); window.scrollTo(0, 0); }
  else if (a === 'pre-quien') { wp.pago = v; ecoPago(); }
  else if (a === 'pre-pagar') {
    var u = Number(wp.dolares) || 0, tc = Number(wp.tc) || 0, mp = mesPago();
    if (!wp.pago) { aviso('Elegí quién pagó.'); return; }
    if (!(u > 0)) { aviso('Poné cuántos dólares se pagaron.'); return; }
    if (u > E.prestamos.deuda + 0.005) { aviso('Es más de lo que falta devolver (' + usd(E.prestamos.deuda) + ').'); return; }
    if (!(tc > 0)) { aviso('Poné el tipo de cambio.'); return; }
    confirmar('¿Cargar este pago?', wp.pago + ' · ' + usd(u) + ' a ' + cambio(tc) + ' (' + pesos(u * tc) + '). Entra en el reparto de ' + mp + '.', 'Cargar pago', function () {
      llamar('apiPagarPrestamo', { pago: wp.pago, dolares: u, tc: tc, fecha: wp.fecha || hoy(), mes: mp }, function () {
        wp = pagoNuevo(); aviso('Pago cargado.'); pintar(); window.scrollTo(0, 0);
      });
    });
  }
  else if (a === 'pn-abrir') { wl.abierto = true; pintar(); }
  else if (a === 'pn-cerrar') { wl = prestamoNuevo(); pintar(); }
  else if (a === 'pn-mon') { wl.moneda = v; ecoNuevo(); buscarTC(); }
  else if (a === 'pn-editar') {
    var pe = E.prestamos.declarados.filter(function (z) { return String(z.fila) === String(v); })[0];
    if (!pe) return;
    wl = prestamoNuevo();
    wl.abierto = true; wl.fila = pe.fila; wl.antes = pe.dolares; wl.quien = pe.detalle; wl.monto = String(pe.dolares); wl.fecha = pe.fecha;
    pintar();
    try { $('pn-card').scrollIntoView({ block: 'center' }); } catch (e) {}
  }
  else if (a === 'pn-borrar') {
    confirmar('¿Borrar este préstamo?', usd(wl.antes) + (wl.quien ? ' · ' + wl.quien : '') + '. Deja de contar en lo que falta devolver.', 'Borrar préstamo', function () {
      llamar('apiEditarPrestamo', { fila: wl.fila, antes: wl.antes, borrar: true }, function () { wl = prestamoNuevo(); aviso('Préstamo borrado.'); pintar(); window.scrollTo(0, 0); });
    }, true);
  }
  else if (a === 'pn-guardar' && wl.fila) {
    var me = Number(wl.monto) || 0, fe = wl.fecha || hoy();
    if (!(me > 0)) { aviso('Poné los dólares.'); return; }
    confirmar('¿Guardar los cambios?', usd(me) + ' · ' + dia(fe) + (wl.quien.trim() ? ' · ' + wl.quien.trim() : '') + '.', 'Guardar cambios', function () {
      llamar('apiEditarPrestamo', { fila: wl.fila, antes: wl.antes, dolares: me, fecha: fe, detalle: wl.quien.trim() }, function () { wl = prestamoNuevo(); aviso('Préstamo corregido.'); pintar(); window.scrollTo(0, 0); });
    });
  }
  else if (a === 'pn-guardar') {
    var qn = wl.quien.trim(), mo = Number(wl.monto) || 0, tcn = Number(wl.tc) || 0, enP = wl.moneda === 'Pesos', fp = wl.fecha || hoy();
    if (!qn) { aviso('Poné quién prestó.'); return; }
    if (!(mo > 0)) { aviso('Poné el monto.'); return; }
    if (enP && !(tcn > 0)) { aviso('Poné el tipo de cambio.'); return; }
    confirmar('¿Anotar este préstamo?', qn + ' · ' + (enP ? pesos(mo) + ' a ' + cambio(tcn) + ' = ' + usd(mo / tcn) : usd(mo)) + ' · ' + dia(fp) + '. Se suma a lo que falta devolver.', 'Anotar préstamo', function () {
      llamar('apiNuevoPrestamo', { quien: qn, moneda: wl.moneda, monto: mo, tc: enP ? tcn : 0, fecha: fp }, function () {
        wl = prestamoNuevo(); aviso('Préstamo anotado.'); pintar(); window.scrollTo(0, 0);
      });
    });
  }
  else if (a === 'pre-anular') {
    var y = E.gastos.filter(function (z) { return z.id === v; })[0];
    if (!y) return;
    confirmar('¿Anular este pago?', y.pago + ' · ' + usd(y.dolares) + ' (' + pesos(y.importe) + '). Vuelve a sumarse a la deuda y deja de contar en ' + y.mes + '.', 'Anular pago', function () {
      llamar('apiAnular', v, function () { aviso('Pago anulado.'); pintar(); });
    }, true);
  }
  else if (a === 'periodo') { perSel = v; pintar(); }
  else if (a === 'exportar') exportar();
  else if (a === 'hist') { abiertoHist = abiertoHist === v ? null : v; pintar(); }
  else if (a === 'tema') {
    document.documentElement.setAttribute('data-tema', v);
    try { localStorage.setItem('gc_tema', v); } catch (e) {}
    pintar();
  }
  else if (a === 'anular') {
    var x = E.gastos.filter(function (y) { return y.id === v; })[0];
    if (!x) return;
    confirmar('¿Anular este gasto?', x.concepto + ' · ' + pesos(x.importe) + ' · ' + x.pago + '. Deja de contar en el mes.', 'Anular gasto', function () {
      llamar('apiAnular', v, function () { we = null; if (vista === 'editar') vista = 'resumen'; aviso('Gasto anulado.'); pintar(); });
    }, true);
  }
  else if (a === 'anular-todas') {
    confirmar('¿Anular esta cuota y las que siguen?', 'Dejan de contar en sus meses. Las cuotas anteriores no se tocan.', 'Anular cuotas', function () {
      llamar('apiAnular', { id: v, todas: true }, function () { we = null; if (vista === 'editar') vista = 'resumen'; aviso('Cuotas anuladas.'); pintar(); });
    }, true);
  }
  else if (a === 'cerrar') {
    var mes = mesSel, c = calc(mes, ingresosDe(mes)), o = {};
    E.integrantes.forEach(function (n, i) { o[n] = ingresosDe(mes)[i]; });
    confirmar('¿Cerrar ' + mes + '?', resultado(c.saldo) + '. Queda grabado en el histórico y no se puede deshacer.', 'Cerrar mes', function () {
      llamar('apiCerrar', { mes: mes, ingresos: o }, function () {
        delete ing[mes]; guardarIng();
        vista = 'historico'; abiertoHist = mes;
        aviso(mes + ' cerrado.'); pintar();
      });
    });
  }
  else if (a === 'modal-ok') { $('modal').hidden = true; var fn = alConfirmar; alConfirmar = null; if (fn) fn(); }
  else if (a === 'modal-no') { $('modal').hidden = true; alConfirmar = null; }
}
function guardarIng() { try { localStorage.setItem('gc_ing', JSON.stringify(ing)); } catch (e) {} }

document.addEventListener('click', function (ev) {
  var el = ev.target.closest ? ev.target.closest('[data-a]') : null;
  if (!el || el.disabled) return;
  accion(el.getAttribute('data-a'), el.getAttribute('data-v'));
});
// Tocar una cantidad de cuotas no le saca el foco (ni el teclado) al importe
document.addEventListener('mousedown', function (ev) {
  if (ev.target.closest && ev.target.closest('[data-a="cuo"], [data-a="pre-quien"], [data-a="pn-mon"]')) ev.preventDefault();
});
// Dice si el texto nuevo sale del anterior con una tecla: un carácter más, o un tramo borrado
function tecleo(a, b) {
  var i = 0;
  while (i < a.length && i < b.length && a.charAt(i) === b.charAt(i)) i++;
  var cola = b.length > a.length ? a.slice(i) : a.slice(i + a.length - b.length);
  return b.length === a.length + 1 ? b.slice(i + 1) === cola : b.length < a.length && b.slice(i) === cola;
}
// Guarda el importe de un campo numérico (c es el texto simple, "1234.5") donde corresponda
function anotar(el, c) {
  var quien = el.getAttribute('data-ing');
  if (el.id === 'in-importe') { W().g.importe = c; ecoCuotas(); }
  else if (el.id === 'pre-usd' || el.id === 'pre-tc') { wp[el.id === 'pre-usd' ? 'dolares' : 'tc'] = c; ecoPago(); }
  else if (el.id === 'pn-monto') { wl.monto = c; ecoNuevo(); }
  else if (el.id === 'pn-tc') { wl.tc = c; wl.tcMano = c !== ''; if (!c) wl.estado = ''; ecoNuevo(); }
  else if (quien) {
    ing[mesSel] = ing[mesSel] || {};
    ing[mesSel][quien] = c;
    guardarIng();
    pintarReparto();
  }
}
document.addEventListener('input', function (ev) {
  var el = ev.target;
  if (el.hasAttribute('data-num')) {
    // Si el texto entró de golpe (pegado, dictado, autocompletado) se lee el número entero, venga como venga; si no, es tecleo
    var antes = el.getAttribute('data-antes'), deGolpe = /^insertFrom|^insertReplacementText/.test(ev.inputType || '') ||
      !tecleo(antes === null ? el.defaultValue : antes, el.value);
    var c = deGolpe ? canon(numero(el.value)) : escrito(el.value);
    el.value = miles(c);
    el.setAttribute('data-antes', el.value);
    anotar(el, c);
  } else if (el.id === 'in-detalle') {
    W().g.detalle = el.value;
    $('b-sig').textContent = textoSig(W());
  } else if (el.id === 'pn-quien') {
    wl.quien = el.value;
  }
});
// Pegar un número del portapapeles: se lee como venga escrito (1.234,56 o 1,234.56) y reemplaza lo que había en el campo
document.addEventListener('paste', function (ev) {
  var el = ev.target, t = '';
  if (!el || !el.hasAttribute || !el.hasAttribute('data-num')) return;
  try { t = (ev.clipboardData || window.clipboardData).getData('text') || ''; } catch (e) { return; }
  ev.preventDefault();
  var c = canon(numero(t));
  if (!c) { aviso('Lo que copiaste no es un número.'); return; }
  el.value = miles(c);
  el.setAttribute('data-antes', el.value);
  anotar(el, c);
});
document.addEventListener('change', function (ev) {
  var el = ev.target, w = W();
  if (el.id === 'sel-cuotas') { if (el.value) w.g.cuotas = Number(el.value); ecoCuotas(); return; }
  // Pago de préstamo: al cambiar el día, el mes lo acompaña; el mes también se puede elegir a mano
  if (el.id === 'pre-fecha') { if (el.value.length === 10) { wp.fecha = el.value; wp.mes = ''; } else el.value = wp.fecha || hoy(); ecoPago(); return; }
  if (el.id === 'pre-mes') { wp.mes = el.value; ecoPago(); return; }
  // Préstamo nuevo: al cambiar el día se busca el dólar BNA de ese día
  if (el.id === 'pn-fecha') { if (el.value.length === 10 && el.value <= hoy()) wl.fecha = el.value; else el.value = wl.fecha || hoy(); ecoNuevo(); buscarTC(); return; }
  if (el.id !== 'in-fecha') return;
  if (el.value.length !== 10) { el.value = w.g.fecha || hoy(); return; }
  w.g.fecha = el.value;
  // En un gasto nuevo el mes acompaña al día elegido, si ese mes está abierto (después se puede cambiar a mano).
  // No se vuelve a dibujar la pantalla para no cerrarle el calendario al que está eligiendo.
  var m = etiquetaDe(el.value);
  if (!w.id && E.abiertos.concat([E.siguiente]).indexOf(m) >= 0) w.g.mes = m;
  var fm = document.querySelector('.vista.on [data-v="mes"] b'), bg = document.querySelector('[data-a="guardar-ed"]');
  if (fm) fm.textContent = w.g.mes || E.actual;
  if (bg) bg.disabled = !hayCambios(w);
});
['pointerover', 'focusin'].forEach(function (n) {
  document.addEventListener(n, function (ev) { tip(ev.target.closest ? ev.target.closest('[data-tip]') : null); });
});
window.addEventListener('scroll', function () { tip(null); }, true);
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter' && (ev.target.id === 'in-importe' || ev.target.id === 'in-detalle')) { ev.preventDefault(); siguiente(); }
});

pintar();
llamar('apiEstado', undefined, function () { if (!escribiendo()) pintar(); }, true, function (m) { falla = m; pintar(); });
</script>
